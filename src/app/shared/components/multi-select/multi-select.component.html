@for (item of selectItems(); track $index) {
  <div class="item" [class.selected]="item.selected" (click)="onClick($index, item)">
    @if (item.icon; as icon) {
      <div class="icon">
        <swc-maskable-icon [icon]="icon"></swc-maskable-icon>
      </div>
    }

    <div class="name">{{ item.name }}</div>
  </div>
}
