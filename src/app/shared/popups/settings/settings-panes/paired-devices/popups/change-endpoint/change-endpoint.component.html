<div class="details">
  <h1 i18n>Change Endpoint</h1>

  <p i18n>If you do not wish to use the default install-to-device endpoint, you can also setup and use your own!</p>
  <p i18n>Please visit
    <a href="https://github.com/scottstraughan/saorsail-device-install-gateway" target="_blank" rel="noopener">
    this repository</a> to view how you can setup your own endpoint for free.</p>

  <swc-icon-input icon="general/cloud" [(value)]="endpoint"></swc-icon-input>

  <swc-icon-button
      i18n-label
      class="use-default"
      title="Use the default endpoint."
      icon="general/rollback"
      label="Restore Default"
      (click)="onUseDefault()"></swc-icon-button>
</div>

<div class="actions">
  <swc-icon-button
      i18n-label
      title="Save the new endpoint and use that from now on."
      icon="general/storage"
      label="Save"
      (click)="onSave()"></swc-icon-button>
</div>
