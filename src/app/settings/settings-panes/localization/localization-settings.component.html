<div class="search">
  <swc-icon-input
      #searchElement
      [(value)]="searchFilterString"
      [placeholder]="'BROWSE_TYPE_TO_SEARCH' | translate"
      icon="general/search"></swc-icon-input>
</div>

<div class="languages">
  @for (lang of filteredLanguages(); track lang) {
    <div class="language" [class.selected]="selectedLanguage().name == lang.name" (click)="onSelectLanguage(lang)">
      <div class="flag">
        <img [ngSrc]="localizationService.getLanguageIcon(lang)" alt="{{ lang.name }} Flag" width="512" height="512" />
      </div>
      <div class="name">{{ lang.name }}</div>
      <div class="selected">
        @if (selectedLanguage().name == lang.name) {
          <swc-maskable-icon icon="general/checked"></swc-maskable-icon>
        }
      </div>
    </div>
  }
</div>
