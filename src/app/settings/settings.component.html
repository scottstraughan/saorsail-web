@if (panels(); as panels) {
  <div class="toc">
    @for (panel of panels; track panel.name) {
      <div class="item" [class.active]="isPanelSelected(panel)" (click)="onSelectSettings(panel)">
        <swc-maskable-icon [icon]="panel.icon"></swc-maskable-icon>
        <div>{{ panel.name | async }}</div>
      </div>
    }
  </div>

  <div class="content">
    @if (selectedPanel(); as selectedPanel) {
      <swc-settings-header [name]="selectedPanel.name | async"></swc-settings-header>

      <swc-settings-content>
        @if (selectedPanel; as settingPanel) {
          <ng-container *ngComponentOutlet="settingPanel.component"></ng-container>
        }
      </swc-settings-content>
    }
  </div>
}
